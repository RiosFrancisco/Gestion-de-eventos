<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/favicon/favIcon.png" type="image/png" />
    <title>Detalle del evento | Festival Manager</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/components/event-container.css" />
    <link rel="stylesheet" href="/css/components/event-list.css" />

    <script type="module" src="/js/detalle-evento.js"></script>
  </head>
  <body>
    <header>
      <button
        id="menu-toggle"
        type="button"
        aria-label="Abrir menú"
        aria-expanded="false"
      >
        <!-- menu icon -->
        <svg
          class="menu-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="#b0b9bf"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>

        <!-- x icon-->
        <svg
          class="x-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2.5"
          stroke="#b0b9bf"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
      <div id="logo" data-page="index.html">
        <img
          src="../assets/img/FestivalLogoWhite.png"
          alt="Festival Manager Logo"
        />
      </div>
      <nav class="nav-buttons-left">
        <button id="add-button">
          <img src="../assets/img/addEventButton.png" alt="Add Event" />
          <p id="add-event-text">Añadir evento</p>
        </button>
        <button class="text-button" id="search-button">
          <img src="../assets/img/searchIcon.png" alt="Search" />
          <p id="search-text">Buscar</p>
        </button>
      </nav>
      <nav class="nav-buttons-right">
        <button class="text-button" id="my-events-button">
          <img src="../assets/img/myEvents.png" alt="My Events" />
          <p id="my-events-text">Mis eventos</p>
        </button>
        <button id="register-button" class="text-button" type="button">
          <img src="../assets/img/registerIcon.png" alt="Register Icon" />
          <p>Registrarse</p>
        </button>
        <button id="user-button" type="button">
          <img src="../assets/img/userIcon.png" alt="User Icon" />
          <p id="user-status">Iniciar sesión</p>
        </button>
        <button id="logout-button" type="button" hidden>
          <img src="../assets/img/logOutIcon.png" alt="Cerrar sesión" />
          <p>Cerrar sesión</p>
        </button>
      </nav>
    </header>
    <main class="event-detail">
      <a class="event-detail__back" href="/pages/index.html"
        >← Volver a eventos</a
      >
      <section class="event-detail__hero" aria-labelledby="detalle-titulo">
        <h1 id="detalle-titulo">Cargando evento…</h1>
        <p id="detalle-descripcion"></p>
        <div class="event-detail__metadata" id="detalle-metadata"></div>
        <p id="detalle-acceso" hidden>
          Para inscribirte,
          <a href="/pages/index.html">iniciá sesión en la página principal</a>.
        </p>
        <button
          class="event-action"
          id="inscribir-evento"
          type="button"
          disabled
        >
          Inscribirme al evento
        </button>
        <p
          class="event-message"
          id="detalle-mensaje"
          role="status"
          aria-live="polite"
        ></p>
      </section>
      <section
        class="event-detail__section"
        aria-labelledby="actividades-titulo"
      >
        <h2 id="actividades-titulo">Actividades del evento</h2>
        <div class="activity-list" id="activity-list">
          <p>Cargando actividades…</p>
        </div>
      </section>
    </main>
  </body>
</html>
