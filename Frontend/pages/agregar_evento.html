    <main class="contenedor-formulario">
      <section class="formulario-card">
        <div class="formulario-titulo">
          <h1>Agregar evento</h1>
          <p>Completá los datos para crear un nuevo evento.</p>
        </div>

        <form>
          <div class="campo">
            <label for="nombre">Nombre del evento</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Ej. Festival de música"
              required
            />
          </div>

          <div class="campo">
            <label for="descripcion">Descripción</label>
            <textarea
              id="descripcion"
              name="descripcion"
              rows="4"
              placeholder="Contá de qué se trata el evento..."
              required
            ></textarea>
          </div>

          <div class="fila-campos">
            <div class="campo">
              <label for="fecha">Fecha</label>
              <input type="date" id="fecha" name="fecha" required />
            </div>

            <div class="campo">
              <label for="hora">Hora</label>
              <input type="time" id="hora" name="hora" required />
            </div>
          </div>

          <div class="campo">
            <label for="ubicacion">Ubicación</label>
            <input
              type="text"
              id="ubicacion"
              name="ubicacion"
              placeholder="Ej. Parque Municipal"
              required
            />
          </div>

          <div class="campo">
            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria" required>
              <option value="">Seleccioná una categoría</option>
              <option value="musica">Música</option>
              <option value="gastronomia">Gastronomía</option>
              <option value="cultura">Cultura</option>
              <option value="deportes">Deportes</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="acciones-formulario">
            <a href="mis_eventos.html" class="boton-cancelar"> Cancelar </a>

            <button type="submit" class="boton-crear">Crear evento</button>
          </div>
        </form>
      </section>
    </main>
