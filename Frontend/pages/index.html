<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Festival Manager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/variables.css" />

    <!-- JavaScript -->
  </head>
  <body>
    <header>
      <nav class="header-buttons">
        <button id="add-button">
          <img />
        </button>
        <button class="text-button" id="my-events-button">Mis eventos</button>
        <button class="text-button" id="search-button">Buscar</button>
      </nav>
      <div class="logo" data-page="index.html">
        <img />
      </div>
      <div class="user-icon">
        <button id="user-button" data-page="login.html">
          <p class="user-status">Iniciar sesión</p>
          <img />
        </button>
      </div>
    </header>
    <main>
      <section class="next-events">
        <h1>Próximos eventos</h2>
      </section>
      <section class="events-list">
        <section class="event-container">
          <div class="event-image">
            <img />
          </div>
          <div class="event-info">
            <h4 id="event-name">event-name</h3>
            <p id="event-date">event-date</p>
            <p id="event-location">event-location</p>
            <p id="event-entrance-price">event-entrance-price</p>
            <p id="event-tags">event-tags</p>
            <p id="event-description">event-description</p>
          </div>
        </section>
      </section>
    </main>
    <footer>
      <section class="footer-logo"></section>
      <section class="footer-info">
        <p>&copy; Festival Manager</p>
        <p>
          Universidad Tecnológica Nacional - Metodología de Sistemas II - 2026
        </p>
        <p>
          Juan Manuel Beltrame - Ramiro Cutropia - Francisco Rios - Matko
          Scabusso
        </p>
      </section>
    </footer>
  </body>
</html>
